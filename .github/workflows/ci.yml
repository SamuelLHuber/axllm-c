name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f dist/axllm/axllm_c.h
      - run: bash -n scripts/update-upstream.sh scripts/verify.sh
      - run: node --check scripts/patch-ax-codegen.mjs
