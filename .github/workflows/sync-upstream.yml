name: Sync Ax

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Ax release tag to sync. Empty means latest release.'
        required: false
        default: ''
      force:
        description: 'Set to true to regenerate even if already synced.'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            version="$(gh release view -R ax-llm/ax --json tagName --jq .tagName)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether sync is needed
        id: need
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          current=""
          test ! -f .ax-upstream-version || current="$(cat .ax-upstream-version)"
          if [ "$current" = "$VERSION" ] && [ "${FORCE:-false}" != "true" ]; then
            echo "sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "sync=true" >> "$GITHUB_OUTPUT"
          fi
          sync_state="$(tail -1 "$GITHUB_OUTPUT")"
          echo "current=${current:-none} latest=$VERSION sync=$sync_state"

      - uses: actions/setup-node@v4
        if: steps.need.outputs.sync == 'true'
        with:
          node-version: '22'

      - name: Install build tools
        if: steps.need.outputs.sync == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ curl libcurl4-openssl-dev libssl-dev

      - name: Sync upstream and generate package
        if: steps.need.outputs.sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AXLLM_C_FORCE_UPDATE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: ./scripts/update-upstream.sh '${{ steps.upstream.outputs.version }}'

      - name: Verify generated package
        if: steps.need.outputs.sync == 'true'
        run: ./scripts/verify.sh

      - name: Commit and push changes
        if: steps.need.outputs.sync == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "sync ax $VERSION with C ABI facade"
            git push
          else
            echo "no changes"
          fi

      - name: Package release asset
        if: steps.need.outputs.sync == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/package-release.sh "$VERSION"
          ./scripts/release-notes.sh "$VERSION" > .release/notes.md

      - name: Publish GitHub release
        if: steps.need.outputs.sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          asset=".release/axllm-c-$VERSION-dist.tar.gz"
          checksum="$asset.sha256"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$checksum" --clobber
            gh release edit "$tag" --notes-file .release/notes.md --latest
          else
            gh release create "$tag" "$asset" "$checksum" --title "axllm-c $VERSION" --notes-file .release/notes.md --latest
          fi

      - name: Summary
        run: echo "Ax ${{ steps.upstream.outputs.version }} sync=${{ steps.need.outputs.sync }}" >> "$GITHUB_STEP_SUMMARY"
